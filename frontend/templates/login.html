<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FASDA Login</title>
    <style>

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

            /* backgroun image*/
            background-image: url("{{ url_for('static', filename='images/what-is-signature.jpeg') }}");
            background-size: cover; /* full */
            background-position: center; /* ortala */
            background-repeat: no-repeat;

            /*Flexbox - to center it */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* login box's div */
        .login-card {
            background-color: rgba(255, 255, 255, 0.15); /* Yarı saydam beyaz */
            backdrop-filter: blur(10px); /* Buzlu cam efekti */
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            width: 300px;
            text-align: center;
            color: white;
        }

        /* title style, ötekilerle aynı */
        h2 {
            margin-bottom: 20px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Input */
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
            background-color: rgba(255, 255, 255, 0.9);
            box-sizing: border-box; /* Padding'in genişliği bozmasını engeller */
            font-size: 14px;
        }

        input:focus {
            outline: none;
            box-shadow: 0 0 5px #4a90e2;
        }

        /* Buton Tasarımı */
        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border: none;
            border-radius: 5px;
            background-color: #007bff; /* BU RENGİ KULLANIYORUZ !!!! */
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #0056b3; /* koyulaştuırıyor, bu güzel*/
        }

        /* Alt Bilgi Yazısı */
        .info-text {
            margin-top: 20px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.8);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>FASDA Demo Login</h2>

        <form method="post">
            <input name="username" type="text" placeholder="Username" required>
            <input name="password" type="password" placeholder="Password" required>
            <button type="submit">LOGIN</button>
        </form>

        <p class="info-text"><b>Demo credentials:</b> admin / admin</p>
    </div>

</body>
</html>
