<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Similarity Distributions</title>

    <style>
        /* Temel Sayfa Ayarları */
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh; /* En az ekran boyu kadar */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

            /* Arka Plan Ayarları */
            background-image: url("{{ url_for('static', filename='images/what-is-signature.jpeg') }}");
            background-size: cover;
            background-position: center;
            background-attachment: fixed; /* Sayfa kaydırılsa da arka plan sabit kalır */
            background-repeat: no-repeat;

            /* İçeriği ortalamak için Flexbox */
            display: flex;
            justify-content: center;
            align-items: flex-start; /* Uzun içerik olduğu için yukarıdan başlatıyoruz */
            padding-top: 50px;
            padding-bottom: 50px;
        }

        /* Ana İçerik Kartı */
        .container {
            background-color: rgba(255, 255, 255, 0.15); /* Yarı saydam */
            backdrop-filter: blur(10px); /* Buzlu cam */
            padding: 50px;
            border-radius: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);

            width: 80%; /* Ekranın %80'ini kaplasın */
            max-width: 900px; /* Ama çok da genişlemesin */
            text-align: center;
            color: white;
        }

        /* Başlıklar */
        h2 {
            margin-bottom: 40px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(255,255,255,0.3);
            padding-bottom: 20px;
        }

        h3 {
            margin-top: 50px;
            margin-bottom: 20px;
            color: #e0e0e0;
        }

        /* Görseller (Grafikler) */
        img {
            max-width: 100%; /* Mobilde taşmayı engeller */
            height: auto;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); /* Grafiğe derinlik katar */
            border: 1px solid rgba(255,255,255,0.2);
            transition: transform 0.3s ease;
        }

        img:hover {
            transform: scale(1.02); /* Üzerine gelince hafif büyür */
        }

        /* "Back to Dashboard" Butonu */
        .back-btn {
            display: inline-block;
            margin-top: 50px;
            padding: 12px 30px;
            background-color: #007bff; /* Login butonuyla aynı mavi */
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            transition: background-color 0.3s, transform 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .back-btn:hover {
            background-color: #0056b3;
            transform: translateY(-2px);
        }

    </style>
</head>

<body>

    <div class="container">
        <h2>Similarity Distribution Graphs</h2>

        <h3>CNN Similarity</h3>
        <img src="{{ url_for('static', filename='plots/cnn_distribution.png') }}" alt="CNN Distribution">

        <h3>HOG Similarity</h3>
        <img src="{{ url_for('static', filename='plots/hog_distribution.png') }}" alt="HOG Distribution">

        <h3>Hybrid Similarity</h3>
        <img src="{{ url_for('static', filename='plots/hybrid_distribution.png') }}" alt="Hybrid Distribution">

        <br>

        <a href="{{ url_for('dashboard') }}" class="back-btn">← Back to Dashboard</a>
    </div>

</body>
</html>
